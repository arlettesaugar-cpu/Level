name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: \({{ github.workflow }}-\){{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🍏 Compilar iOS (IPA sin firma)
    runs-on: macos-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Java (requerido para utilidades complementarias)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: 🔍 Diagnóstico de entorno (Flutter Doctor)
        run: flutter doctor -v

      - name: 📱 Asegurar plataforma iOS y dependencias de Flutter
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: 🍏 Instalar CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: 🔨 Compilar iOS IPA (Sin firma)
        run: flutter build ipa --no-codesign

      - name: 📦 Empaquetar archivo IPA
        run: |
          mkdir -p build/ios/ipa
          if compgen -G "build/ios/ipa/*.ipa" > /dev/null; then
            echo "Archivo IPA ya generado por Flutter."
          elif [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            echo "Creando paquete IPA desde Runner.xcarchive..."
            mkdir -p build/ios/ipa/Payload
            cp -r "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r canchas_ya_unsigned.ipa Payload
            rm -rf Payload
            cd ../../..
          elif [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Creando paquete IPA desde iphoneos build..."
            mkdir -p build/ios/ipa/Payload
            cp -r "build/ios/iphoneos/Runner.app" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -r canchas_ya_unsigned.ipa Payload
            rm -rf Payload
            cd ../../..
          fi

      - name: 📤 Subir archivo IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive
