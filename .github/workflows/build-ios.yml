name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🍏 Compilar iOS (IPA sin firma)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar scaffolding iOS si no existe
        run: |
          if [ ! -d "ios" ]; then
            echo "Generando plataforma iOS..."
            flutter create . --platforms=ios
          fi

      - name: 📦 Instalar dependencias de Flutter
        run: flutter pub get

      - name: 🍏 Instalar CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: 🔨 Compilar binario iOS (Release sin firma)
        run: flutter build ios --release --no-codesign

      - name: 📦 Empaquetar archivo IPA instalador
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q LevelPadel_iOS_Unsigned.ipa Payload
          rm -rf Payload
          cd ../../..

      - name: 📤 Subir archivo IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build/ios/ipa/LevelPadel_iOS_Unsigned.ipa
          retention-days: 14


