name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🍏 Compilar iOS (IPA sin firma)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar estructura iOS si no existe
        run: |
          if [ ! -d "ios" ]; then
            echo "Generando plataforma iOS..."
            flutter create . --platforms=ios
          fi

      - name: 📦 Instalar dependencias de Flutter
        run: flutter pub get

      - name: 🍏 Instalar CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: ⚙️ Configurar proyecto para compilación sin firma (Bypass CodeSign)
        run: |
          # 1. Precompilar frameworks y dependencias Dart AOT
          flutter build ios --release --config-only
          
          # 2. Inyectar banderas para desactivar la firma obligatoria en Xcode
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Generated.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Generated.xcconfig
          echo "DEVELOPMENT_TEAM=0000000000" >> ios/Flutter/Generated.xcconfig

      - name: 🔨 Compilar binario nativo iOS con Xcode
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath ../build/ios_derived \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build
          cd ..

      - name: 📦 Empaquetar archivo IPA instalador
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Runner.app encontrado en: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q LevelPadel_iOS_Unsigned.ipa Payload
          rm -rf Payload
          cd ../..

      - name: 📤 Subir archivo IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build/ios/ipa/LevelPadel_iOS_Unsigned.ipa
          retention-days: 14
