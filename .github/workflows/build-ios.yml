name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Compilar iOS IPA sin firma
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Generar plataforma iOS
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: Verificar estructura iOS generada
        run: ls -la ios/ && ls -la ios/Runner.xcodeproj/ 2>/dev/null || echo "sin xcodeproj"

      - name: Instalar CocoaPods si hay Podfile
        run: |
          if [ -f "ios/Podfile" ]; then
            echo "Podfile encontrado, ejecutando pod install..."
            cd ios && pod install --repo-update && cd ..
          else
            echo "Sin Podfile - todos los paquetes son Dart puro, CocoaPods no requerido."
          fi

      - name: Parchear Xcode para compilar sin cuenta Apple
        run: |
          if [ -f "ios/Flutter/Release.xcconfig" ]; then
            printf '\nDEVELOPMENT_TEAM = AAAAAAAAAA\nCODE_SIGNING_ALLOWED = NO\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGN_IDENTITY =\nPROVISIONING_PROFILE_SPECIFIER =\n' >> ios/Flutter/Release.xcconfig
          fi
          if [ -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            python3 .github/scripts/patch_xcode.py
          fi

      - name: Compilar iOS con xcodebuild
        run: |
          cd ios
          if [ -d "Runner.xcworkspace" ]; then
            BUILD_TARGET="-workspace Runner.xcworkspace"
          elif [ -f "Runner.xcodeproj/project.pbxproj" ]; then
            BUILD_TARGET="-project Runner.xcodeproj"
          else
            echo "ERROR: No se encontro Runner.xcodeproj ni Runner.xcworkspace"
            ls -la
            exit 1
          fi
          echo "Usando: $BUILD_TARGET"
          xcodebuild $BUILD_TARGET \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "../build/ios_derived" \
            DEVELOPMENT_TEAM=AAAAAAAAAA \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tail -100
          cd ..

      - name: Empaquetar IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app no encontrado"
            find build -type d | head -20
            exit 1
          fi
          echo "Runner.app en: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q LevelPadel_iOS_Unsigned.ipa Payload
          rm -rf Payload
          cd ../..
          ls -lh build/ios/ipa/

      - name: Subir IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build/ios/ipa/LevelPadel_iOS_Unsigned.ipa
          retention-days: 14
