name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🍏 Compilar iOS (IPA sin firma)
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar plataforma iOS y descargar paquetes
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: 🍏 Instalar CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: 🛡️ Desactivar restricciones de firma en Xcode
        run: |
          # Desactivar firma en project.pbxproj antes de compilar
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = ""; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj || true

          # Inyectar banderas en Release.xcconfig
          echo "" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM = " >> ios/Flutter/Release.xcconfig

      - name: 🔨 Compilar Release iOS (Sin firma)
        run: flutter build ios --release --no-codesign

      - name: 📦 Empaquetar archivo IPA instalador
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "App compilada encontrada en: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q LevelPadel_iOS_Unsigned.ipa Payload
          rm -rf Payload
          cd ../..

      - name: 📤 Subir archivo IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build/ios/ipa/LevelPadel_iOS_Unsigned.ipa
          retention-days: 14
