name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🍏 Compilar iOS (IPA sin firma)
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar plataforma iOS y dependencias
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: 🍏 Instalar CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: 🛡️ Inyectar configuración de firma sin cuenta de Apple (Bypass Total)
        run: |
          # 1. Inyectar en todos los archivos xcconfig
          for f in ios/Flutter/*.xcconfig; do
            [ -e "$f" ] || continue
            echo "" >> "$f"
            echo "DEVELOPMENT_TEAM = A1B2C3D4E5" >> "$f"
            echo "CODE_SIGNING_ALLOWED = NO" >> "$f"
            echo "CODE_SIGNING_REQUIRED = NO" >> "$f"
            echo "CODE_SIGN_IDENTITY = " >> "$f"
            echo "EXPANDED_CODE_SIGN_IDENTITY = " >> "$f"
          done

          # 2. Inyectar en project.pbxproj para engañar al check de Flutter y desactivar la firma en Xcode
          sed -i '' 's/buildSettings = {/buildSettings = {\
  				DEVELOPMENT_TEAM = A1B2C3D4E5;\
  				CODE_SIGNING_ALLOWED = NO;\
  				CODE_SIGNING_REQUIRED = NO;\
  				CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj || true

      - name: 🔨 Compilar Release iOS (Sin firma)
        run: flutter build ios --release --no-codesign

      - name: 📦 Empaquetar archivo IPA instalador
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "App compilada encontrada en: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q LevelPadel_iOS_Unsigned.ipa Payload
          rm -rf Payload
          cd ../..

      - name: 📤 Subir archivo IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build/ios/ipa/LevelPadel_iOS_Unsigned.ipa
          retention-days: 14
