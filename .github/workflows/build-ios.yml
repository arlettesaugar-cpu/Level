name: iOS CI/CD Build (Unsigned IPA)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 🍏 Compilar iOS (IPA sin firma)
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐦 Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📱 Generar plataforma iOS y descargar paquetes
        run: |
          flutter create . --platforms=ios
          flutter pub get

      - name: 🍏 Instalar CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: ⚙️ Compilar assets Dart (sin firmar)
        run: flutter build bundle --release

      - name: 🛡️ Parchear proyecto Xcode: desactivar firma y asignar Team ficticio
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"

          # Agregar Team ficticio + desactivar firma en CADA bloque buildSettings del proyecto
          python3 - <<'PYEOF'
import re, sys

path = "ios/Runner.xcodeproj/project.pbxproj"
with open(path, "r") as f:
    content = f.read()

# Reemplazar todas las apariciones de "buildSettings = {" con los ajustes necesarios
inject = (
    "buildSettings = {\n"
    "\t\t\t\tDEVELOPMENT_TEAM = AAAAAAAAAA;\n"
    "\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n"
    "\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n"
    "\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n"
    "\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";\n"
)
content = content.replace("buildSettings = {", inject)

with open(path, "w") as f:
    f.write(content)

print("project.pbxproj parcheado correctamente.")
PYEOF

          # Parchear Release.xcconfig también
          {
            echo ""
            echo "DEVELOPMENT_TEAM = AAAAAAAAAA"
            echo "CODE_SIGNING_ALLOWED = NO"
            echo "CODE_SIGNING_REQUIRED = NO"
            echo "CODE_SIGN_IDENTITY ="
            echo "PROVISIONING_PROFILE_SPECIFIER ="
          } >> ios/Flutter/Release.xcconfig

          cat ios/Flutter/Release.xcconfig

      - name: 🔨 Compilar binario iOS nativo con Xcode (sin firma)
        run: |
          cd ios
          if [ -d "Runner.xcworkspace" ]; then
            WORKSPACE_ARG="-workspace Runner.xcworkspace"
          else
            WORKSPACE_ARG="-project Runner.xcodeproj"
          fi

          xcodebuild $WORKSPACE_ARG \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "../build/ios_derived" \
            DEVELOPMENT_TEAM="AAAAAAAAAA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tail -40
          cd ..

      - name: 📦 Empaquetar instalador IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
          echo "Runner.app encontrado en: $APP_PATH"
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q LevelPadel_iOS_Unsigned.ipa Payload
          rm -rf Payload
          cd ../..
          echo "IPA generado correctamente."

      - name: 📤 Subir IPA como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: build/ios/ipa/LevelPadel_iOS_Unsigned.ipa
          retention-days: 14
