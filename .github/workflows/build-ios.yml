name: iOS Build (Oficial Firmado Apple)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Compilar IPA Firmado para iPhone
    runs-on: macos-latest
    timeout-minutes: 35

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Generar estructura iOS
        run: |
          pip3 install Pillow --break-system-packages || pip3 install Pillow || true
          flutter create . --platforms=ios --org com.levelpadel
          python3 .github/scripts/patch_xcode.py
          flutter pub get

      - name: Instalar Certificado de Apple en Keychain
        run: |
          CERT_PATH=".github/certs/distribution.p12"
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          security create-keychain -p "temporal_123" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temporal_123" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "LevelPadel2026!" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporal_123" "$KEYCHAIN_PATH"
          echo "Certificado importado exitosamente en el llavero."

      - name: Compilar aplicacion iOS con Flutter
        run: |
          flutter build ios --release --no-codesign

      - name: Firmar Runner.app con Certificado y Perfil Oficial
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app no fue generado"
            exit 1
          fi
          echo "App encontrada en: $APP_PATH"

          # 1. Inyectar perfil oficial de aprovisionamiento de Apple
          cp .github/certs/Level_Profile.mobileprovision "$APP_PATH/embedded.mobileprovision"

          # 2. Extraer entitlements oficiales del perfil
          security cms -D -i .github/certs/Level_Profile.mobileprovision > /tmp/profile.plist
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" /tmp/profile.plist > /tmp/entitlements.plist

          # 3. Obtener el nombre de identidad del certificado
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Apple Distribution" | head -1 | awk -F'"' '{print $2}')
          if [ -z "$IDENTITY" ]; then
            IDENTITY="Apple Distribution: Sergio Yumio Cervantes Moriya (2VY7U35749)"
          fi
          echo "Firmando con identidad: $IDENTITY"

          # 4. Firmar Frameworks embebidos
          if [ -d "$APP_PATH/Frameworks" ]; then
            for fw in "$APP_PATH"/Frameworks/*; do
              if [ -d "$fw" ] || [ -f "$fw" ]; then
                codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --timestamp=none "$fw" || true
              fi
            done
          fi

          # 5. Firmar Runner.app con los entitlements
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" --entitlements /tmp/entitlements.plist --timestamp=none "$APP_PATH"

          # 6. Validar firma
          echo "Validando firma digital:"
          codesign -vvv --deep --strict "$APP_PATH"

      - name: Empaquetar IPA firmado para distribucion
        run: |
          mkdir -p build/ios/ipa/Payload
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -n 1)
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -r -q LevelPadel_iOS_Signed.ipa Payload && rm -rf Payload)
          echo "IPA generado exitosamente:"
          ls -lh build/ios/ipa/LevelPadel_iOS_Signed.ipa

      - name: Subir IPA de iPhone como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: Level-iPhone-App-IPA
          path: build/ios/ipa/LevelPadel_iOS_Signed.ipa
          retention-days: 14

      - name: Subir IPA a TestFlight / App Store Connect
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: 'build/ios/ipa/LevelPadel_iOS_Signed.ipa'
          issuer-id: ${{ secrets.ISSUER_ID }}
          api-key-id: ${{ secrets.KEY_ID }}
          api-private-key: ${{ secrets.applekey }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
